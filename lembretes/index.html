<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lembretes</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lembretes">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{
    --bg:#0a0a0a; --bg2:#161616; --card:#121212;
    --border:rgba(255,255,255,0.14);
    --text:#ffffff; --text-on-accent:#0a0a0a; --muted:#9a9a9a;
    --accent:#d7ff1a; --danger:#ff2d2d; --ok:#00e676; --alerta:#ff9800;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  html.light{
    --bg:#f2f2ef; --bg2:#e6e6e1; --card:#ffffff;
    --border:rgba(0,0,0,0.16);
    --text:#141414; --text-on-accent:#141414; --muted:#6b6b6b;
    --ok:#00b85c; --alerta:#c96a00;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    -webkit-tap-highlight-color:transparent; overscroll-behavior-y:none;
  }
  .wrap{
    max-width:560px; margin:0 auto;
    padding:calc(var(--safe-top) + .75rem) 1rem calc(var(--safe-bottom) + 2rem);
    min-height:100dvh; display:flex; flex-direction:column; gap:1rem;
  }
  header{display:flex; align-items:center; justify-content:space-between; gap:.5rem;}
  .brand{display:flex; align-items:center; gap:.6rem;}
  .stripes{display:flex; align-items:flex-end; gap:3px; height:1.15rem;}
  .stripes span{width:5px; background:var(--accent); transform:skewX(-18deg);}
  .stripes span:nth-child(1){height:55%} .stripes span:nth-child(2){height:78%} .stripes span:nth-child(3){height:100%}
  header h1{font-size:1.05rem; font-weight:900; letter-spacing:.05em; text-transform:uppercase; margin:0;}
  .icone-btn{
    background:var(--card); color:var(--text); border:1.5px solid var(--border);
    border-radius:.5rem; padding:.45rem .6rem; font-size:.95rem; cursor:pointer; line-height:1;
  }

  .banner{
    border:1.5px solid var(--border); border-left:4px solid var(--alerta);
    background:var(--card); border-radius:.6rem; padding:.8rem .9rem;
    font-size:.85rem; line-height:1.45; display:flex; flex-direction:column; gap:.6rem;
  }
  .banner.grave{border-left-color:var(--danger);}
  .banner strong{display:block; font-size:.9rem; margin-bottom:.15rem;}
  .banner p{margin:0; color:var(--muted);}

  .cartao{background:var(--card); border:1.5px solid var(--border); border-radius:.75rem; padding:1rem;}

  textarea, input[type="text"], input[type="password"], input[type="datetime-local"]{
    width:100%; background:var(--bg2); color:var(--text);
    border:1.5px solid var(--border); border-radius:.55rem;
    padding:.7rem .75rem; font-size:1rem; font-family:inherit; resize:vertical;
  }
  textarea{min-height:5.2rem;}
  textarea:focus, input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  label{display:block; font-size:.72rem; text-transform:uppercase; letter-spacing:.06em;
        color:var(--muted); font-weight:800; margin:0 0 .35rem;}

  .linha{display:flex; gap:.5rem; align-items:center;}
  .linha > *{flex:1;}
  .btn{
    border:none; border-radius:.55rem; padding:.75rem 1rem; font-size:.9rem;
    font-weight:900; text-transform:uppercase; letter-spacing:.04em;
    cursor:pointer; font-family:inherit;
  }
  .btn.primario{background:var(--accent); color:var(--text-on-accent);}
  .btn.neutro{background:var(--bg2); color:var(--text); border:1.5px solid var(--border);}
  .btn.perigo{background:transparent; color:var(--danger); border:1.5px solid var(--danger);}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn.gravando{background:var(--danger); color:#fff; animation:pulsa 1.1s infinite;}
  @keyframes pulsa{50%{opacity:.55}}

  .grupo{margin-top:.35rem;}
  .grupo h2{
    font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; font-weight:900;
    color:var(--muted); margin:1.1rem 0 .5rem; display:flex; align-items:center; gap:.5rem;
  }
  .grupo h2::after{content:""; flex:1; height:1px; background:var(--border);}
  .grupo.atrasado h2{color:var(--danger);}

  .item{
    background:var(--card); border:1.5px solid var(--border); border-left:4px solid var(--accent);
    border-radius:.6rem; padding:.8rem .9rem; margin-bottom:.55rem;
  }
  .item.atrasado{border-left-color:var(--danger);}
  .item.duvidoso{border-left-color:var(--alerta);}
  .item h3{margin:0 0 .25rem; font-size:1rem; font-weight:700; line-height:1.3;}
  .item .meta{font-size:.78rem; color:var(--muted); line-height:1.5;}
  .item .meta b{color:var(--text); font-weight:700;}
  .item .meta .vermelho{color:var(--danger); font-weight:800;}
  .acoes{display:flex; gap:.4rem; margin-top:.7rem; flex-wrap:wrap;}
  .acoes button{
    flex:0 0 auto; background:var(--bg2); color:var(--text);
    border:1.5px solid var(--border); border-radius:.45rem;
    padding:.45rem .6rem; font-size:.78rem; font-weight:700; cursor:pointer; font-family:inherit;
  }
  .acoes button.feito{border-color:var(--ok); color:var(--ok);}
  .acoes button.apagar{border-color:var(--danger); color:var(--danger); margin-left:auto;}

  .vazio{text-align:center; color:var(--muted); padding:2rem 1rem; font-size:.9rem; line-height:1.6;}
  .aviso-erro{color:var(--danger); font-size:.82rem; margin-top:.5rem; line-height:1.45;}
  .carregando{color:var(--muted); font-size:.85rem; text-align:center; padding:1rem;}

  details.feitos{margin-top:1rem;}
  details.feitos summary{
    cursor:pointer; color:var(--muted); font-size:.75rem; font-weight:800;
    text-transform:uppercase; letter-spacing:.06em; padding:.5rem 0;
  }
  details.feitos .item{border-left-color:var(--ok); opacity:.72;}
  details.feitos .item h3{text-decoration:line-through;}

  footer{
    margin-top:auto; padding-top:1.5rem; display:flex; align-items:center;
    justify-content:center; gap:.6rem; color:var(--muted); font-size:.75rem;
  }
  footer .bcr-logo{display:flex;}
  footer .bcr-logo svg{height:1.7rem; width:auto;}
  @media (max-width:360px){ .acoes button{font-size:.72rem; padding:.4rem .5rem;} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="stripes" aria-hidden="true"><span></span><span></span><span></span></span>
      <h1>Lembretes</h1>
    </div>
    <div class="linha" style="flex:0 0 auto;">
      <button class="icone-btn" id="btnAtualizar" title="Atualizar" aria-label="Atualizar">⟳</button>
      <button class="icone-btn" id="btnTema" title="Tema" aria-label="Alternar tema">☀️</button>
    </div>
  </header>

  <div id="banners"></div>

  <section class="cartao" id="telaPin" hidden>
    <label for="campoPin">PIN de acesso</label>
    <input type="password" id="campoPin" inputmode="numeric" autocomplete="current-password" placeholder="••••••">
    <div class="linha" style="margin-top:.6rem;">
      <button class="btn primario" id="btnEntrar">Entrar</button>
    </div>
    <p class="aviso-erro" id="erroPin" hidden></p>
  </section>

  <main id="app" hidden>
    <section class="cartao">
      <label for="recado">O que você não pode perder?</label>
      <textarea id="recado" placeholder="Ex.: preciso enviar o relatório da Pharma sexta às 14h"></textarea>
      <div class="linha" style="margin-top:.6rem;">
        <button class="btn neutro" id="btnGravar">🎤 Gravar</button>
        <button class="btn primario" id="btnAdicionar">Adicionar</button>
      </div>
      <p class="aviso-erro" id="erroCaptura" hidden></p>
      <p class="carregando" id="statusCaptura" hidden></p>
    </section>

    <section class="cartao" id="confirmacao" hidden>
      <label>Confira antes de salvar</label>
      <input type="text" id="confTitulo" placeholder="Título">
      <div style="margin-top:.55rem;">
        <label for="confPrazo">Prazo</label>
        <input type="datetime-local" id="confPrazo">
      </div>
      <p class="meta" id="confObs" style="font-size:.78rem; color:var(--muted); margin:.5rem 0 0;"></p>
      <div class="linha" style="margin-top:.7rem;">
        <button class="btn neutro" id="btnDescartar">Descartar</button>
        <button class="btn primario" id="btnSalvar">Salvar</button>
      </div>
    </section>

    <section id="lista"><p class="carregando">Carregando…</p></section>

    <details class="feitos" id="blocoFeitos" hidden>
      <summary>Concluídos recentemente</summary>
      <div id="listaFeitos"></div>
    </details>
  </main>

  <footer>
    <span class="bcr-logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 62" role="img" aria-label="BCR — Beatriz C Reis">

    </svg></span>
    <span>Created by Beatriz C Reis</span>
  </footer>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const estado = { pin: null, pendentes: [], feitos: [], proposta: null, gravador: null, pedacos: [] };

// ─── Tema (mesma chave dos outros apps, para o visual acompanhar) ───────────
function aplicarTema(claro){
  document.documentElement.classList.toggle('light', claro);
  $('btnTema').textContent = claro ? '🌙' : '☀️';
  document.querySelector('meta[name=theme-color]').setAttribute('content', claro ? '#f2f2ef' : '#0a0a0a');
  try { localStorage.setItem('jogos_theme', claro ? 'light' : 'dark'); } catch(e){}
}
$('btnTema').onclick = () => aplicarTema(!document.documentElement.classList.contains('light'));
try { aplicarTema(localStorage.getItem('jogos_theme') === 'light'); } catch(e){ aplicarTema(false); }

// ─── PIN: no localStorage para a tela, no IndexedDB para o service worker ───
// O service worker precisa do PIN para que os botões "Feito"/"Adiar" da
// notificação funcionem com o app fechado. Só resolve quando a transação
// realmente comitou — se isso falhar em silêncio, os botões param de funcionar.
const BD = 'lembretes-cfg';
function guardarPinNoBanco(pin){
  return new Promise((ok) => {
    let req;
    try { req = indexedDB.open(BD, 1); } catch(e){ return ok(false); }
    req.onupgradeneeded = () => req.result.createObjectStore('cfg');
    req.onerror = () => ok(false);
    req.onblocked = () => ok(false);
    req.onsuccess = () => {
      const bd = req.result;
      try {
        const tx = bd.transaction('cfg','readwrite');
        tx.objectStore('cfg').put(pin, 'pin');
        tx.oncomplete = () => { bd.close(); ok(true); };
        tx.onerror = tx.onabort = () => { bd.close(); ok(false); };
      } catch(e){ bd.close(); ok(false); }
    };
  });
}

async function api(caminho, opcoes = {}){
  const r = await fetch(caminho, {
    ...opcoes,
    headers: { 'Content-Type':'application/json', 'x-lembretes-pin': estado.pin || '', ...(opcoes.headers||{}) },
  });
  const texto = await r.text();
  const corpo = texto ? JSON.parse(texto) : {};
  if (!r.ok) { const e = new Error(corpo.erro || `Erro ${r.status}`); e.status = r.status; throw e; }
  return corpo;
}

// ─── Formatação ────────────────────────────────────────────────────────────
const fmtPrazo = new Intl.DateTimeFormat('pt-BR', {
  weekday:'short', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit',
});
const paraInput = (iso) => {
  const d = new Date(iso), z = (n) => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`;
};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const TITULOS = { atrasado:'Atrasados', hoje:'Hoje', amanha:'Amanhã', semana:'Esta semana', depois:'Mais adiante' };
const ORDEM = ['atrasado','hoje','amanha','semana','depois'];

function cartaoLembrete(l, concluido = false){
  const atrasado = l.faixa === 'atrasado';
  const duvidoso = l.confianca && l.confianca !== 'alta';
  const classes = ['item', atrasado && !concluido ? 'atrasado' : '', duvidoso && !concluido ? 'duvidoso' : ''].filter(Boolean).join(' ');
  const proximo = l.proximoAviso
    ? `Próximo aviso: ${fmtPrazo.format(new Date(l.proximoAviso.em))}`
    : (concluido ? '' : 'Sem próximo aviso');

  const acoes = concluido
    ? `<button data-acao="reabrir" data-id="${l.id}">↩︎ Reabrir</button>
       <button class="apagar" data-acao="apagar" data-id="${l.id}">🗑</button>`
    : `<button class="feito" data-acao="concluir" data-id="${l.id}">✅ Feito</button>
       <button data-acao="adiar" data-minutos="60" data-id="${l.id}">⏰ +1h</button>
       <button data-acao="adiar" data-minutos="1440" data-id="${l.id}">📅 +1 dia</button>
       <button class="apagar" data-acao="apagar" data-id="${l.id}">🗑</button>`;

  return `<article class="${classes}">
    <h3>${esc(l.titulo)}</h3>
    <p class="meta">
      <b>${esc(fmtPrazo.format(new Date(l.prazo)))}</b>
      · <span class="${atrasado && !concluido ? 'vermelho' : ''}">${esc(l.falta)}</span>
      ${l.detalhes ? `<br>${esc(l.detalhes)}` : ''}
      ${duvidoso && !concluido ? `<br>⚠️ Confira a data${l.observacao ? ': ' + esc(l.observacao) : ''}` : ''}
      ${proximo ? `<br>${esc(proximo)}` : ''}
    </p>
    <div class="acoes">${acoes}</div>
  </article>`;
}

function render(){
  const alvo = $('lista');
  if (estado.pendentes.length === 0){
    alvo.innerHTML = `<p class="vazio">Nada pendente.<br>Mande um recado acima — por texto ou áudio.</p>`;
  } else {
    const grupos = {};
    for (const l of estado.pendentes) (grupos[l.faixa] ||= []).push(l);
    alvo.innerHTML = ORDEM.filter((f) => grupos[f]).map((f) => `
      <section class="grupo ${f}">
        <h2>${TITULOS[f]} · ${grupos[f].length}</h2>
        ${grupos[f].map((l) => cartaoLembrete(l)).join('')}
      </section>`).join('');
  }

  $('blocoFeitos').hidden = estado.feitos.length === 0;
  $('listaFeitos').innerHTML = estado.feitos.map((l) => cartaoLembrete(l, true)).join('');
}

$('lista').addEventListener('click', tratarAcao);
$('listaFeitos').addEventListener('click', tratarAcao);

async function tratarAcao(ev){
  const botao = ev.target.closest('button[data-acao]');
  if (!botao) return;
  const { id, acao, minutos } = botao.dataset;
  botao.disabled = true;
  try {
    if (acao === 'apagar'){
      if (!confirm('Apagar este lembrete de vez?')) { botao.disabled = false; return; }
      await api(`api/reminders?id=${encodeURIComponent(id)}`, { method:'DELETE' });
    } else {
      const corpo = acao === 'adiar' ? { acao:'adiar', minutos: Number(minutos) } : { acao };
      await api(`api/reminders?id=${encodeURIComponent(id)}`, { method:'PATCH', body: JSON.stringify(corpo) });
    }
    await carregar();
  } catch (e){
    alert(e.message);
    botao.disabled = false;
  }
}

async function carregar(){
  try {
    const dados = await api('api/reminders');
    estado.pendentes = dados.pendentes;
    estado.feitos = dados.feitos;
    render();
  } catch (e){
    if (e.status === 401) return mostrarTelaPin('PIN incorreto.');
    $('lista').innerHTML = `<p class="vazio">Não consegui carregar.<br>${esc(e.message)}</p>`;
  }
}

// ─── Captura ───────────────────────────────────────────────────────────────
function statusCaptura(texto){
  const el = $('statusCaptura');
  el.textContent = texto || '';
  el.hidden = !texto;
}
function erroCaptura(texto){
  const el = $('erroCaptura');
  el.textContent = texto || '';
  el.hidden = !texto;
}

async function interpretarRecado(texto, origem){
  erroCaptura('');
  statusCaptura('Interpretando…');
  $('btnAdicionar').disabled = true;
  try {
    const { lembrete } = await api('api/reminders', { method:'POST', body: JSON.stringify({ recado: texto, origem }) });
    // Salvo já — a confirmação serve para corrigir, não para autorizar. Um prazo
    // que depende de um segundo toque é um prazo que se perde no segundo toque.
    estado.proposta = lembrete;
    $('recado').value = '';
    $('confTitulo').value = lembrete.titulo;
    $('confPrazo').value = paraInput(lembrete.prazo);
    $('confObs').textContent = lembrete.confianca === 'alta'
      ? 'Já está salvo e agendado. Ajuste se algo ficou errado.'
      : `⚠️ Confirme a data. ${lembrete.observacao || ''}`.trim();
    $('confirmacao').hidden = false;
    await carregar();
  } catch (e){
    if (e.status === 401) return mostrarTelaPin('PIN incorreto.');
    erroCaptura(e.message);
  } finally {
    statusCaptura('');
    $('btnAdicionar').disabled = false;
  }
}

$('btnAdicionar').onclick = () => {
  const texto = $('recado').value.trim();
  if (!texto) return erroCaptura('Escreva ou grave um recado primeiro.');
  interpretarRecado(texto, 'texto');
};
$('recado').addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') $('btnAdicionar').click();
});

$('btnDescartar').onclick = async () => {
  if (estado.proposta && confirm('Descartar este lembrete?')){
    try { await api(`api/reminders?id=${encodeURIComponent(estado.proposta.id)}`, { method:'DELETE' }); } catch(e){}
    await carregar();
  }
  $('confirmacao').hidden = true;
  estado.proposta = null;
};

$('btnSalvar').onclick = async () => {
  if (!estado.proposta) return;
  const titulo = $('confTitulo').value.trim();
  const prazo = $('confPrazo').value;
  if (!titulo) return alert('O título não pode ficar vazio.');
  if (!prazo) return alert('Informe o prazo.');
  $('btnSalvar').disabled = true;
  try {
    await api(`api/reminders?id=${encodeURIComponent(estado.proposta.id)}`, {
      method:'PATCH',
      body: JSON.stringify({ acao:'editar', titulo, prazo: new Date(prazo).toISOString() }),
    });
    $('confirmacao').hidden = true;
    estado.proposta = null;
    await carregar();
  } catch (e){ alert(e.message); }
  finally { $('btnSalvar').disabled = false; }
};

// ─── Áudio ─────────────────────────────────────────────────────────────────
const MIMES = ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
function mimeSuportado(){
  if (typeof MediaRecorder === 'undefined') return null;
  return MIMES.find((m) => { try { return MediaRecorder.isTypeSupported(m); } catch(e){ return false; } }) || '';
}

$('btnGravar').onclick = async () => {
  const botao = $('btnGravar');
  if (estado.gravador && estado.gravador.state === 'recording'){
    estado.gravador.stop();
    return;
  }
  if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined'){
    return erroCaptura('Este navegador não grava áudio. Digite o recado.');
  }
  erroCaptura('');
  try {
    const trilha = await navigator.mediaDevices.getUserMedia({ audio:true });
    const mime = mimeSuportado();
    const gravador = new MediaRecorder(trilha, mime ? { mimeType: mime } : undefined);
    estado.gravador = gravador;
    estado.pedacos = [];
    gravador.ondataavailable = (e) => { if (e.data.size) estado.pedacos.push(e.data); };
    gravador.onstop = async () => {
      trilha.getTracks().forEach((t) => t.stop());
      botao.classList.remove('gravando');
      botao.textContent = '🎤 Gravar';
      clearTimeout(estado.limite);
      const blob = new Blob(estado.pedacos, { type: gravador.mimeType || 'audio/webm' });
      estado.gravador = null;
      if (blob.size < 1200) return erroCaptura('Gravação curta demais.');
      await transcrever(blob);
    };
    gravador.start();
    botao.classList.add('gravando');
    botao.textContent = '⏹ Parar';
    // Teto de 2 minutos: acima disso o corpo da requisição estoura o limite da plataforma.
    estado.limite = setTimeout(() => { if (estado.gravador?.state === 'recording') estado.gravador.stop(); }, 120000);
  } catch (e){
    erroCaptura('Não consegui acessar o microfone. Verifique a permissão.');
  }
};

function paraBase64(blob){
  return new Promise((ok, falha) => {
    const leitor = new FileReader();
    leitor.onload = () => ok(String(leitor.result).split(',')[1]);
    leitor.onerror = () => falha(leitor.error);
    leitor.readAsDataURL(blob);
  });
}

async function transcrever(blob){
  statusCaptura('Transcrevendo…');
  try {
    const audio = await paraBase64(blob);
    const { texto } = await api('api/transcribe', {
      method:'POST',
      body: JSON.stringify({ audio, mime: blob.type }),
    });
    $('recado').value = texto;
    statusCaptura('');
    await interpretarRecado(texto, 'audio');
  } catch (e){
    statusCaptura('');
    if (e.status === 401) return mostrarTelaPin('PIN incorreto.');
    erroCaptura(e.message);
  }
}

// ─── Banners de estado (é aqui que o push do iPhone se salva ou se perde) ───
const ehIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const instalado = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

function renderBanners(){
  const caixa = $('banners');
  const partes = [];

  if (ehIOS && !instalado){
    partes.push(`<div class="banner grave">
      <div><strong>No iPhone, instale na tela de início</strong>
      <p>Enquanto o app estiver só numa aba do Safari, o iOS não entrega nenhuma
      notificação. Toque em Compartilhar → Adicionar à Tela de Início e abra por lá.</p></div>
    </div>`);
  } else if (!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)){
    partes.push(`<div class="banner grave">
      <div><strong>Este navegador não recebe notificações</strong>
      <p>A lista continua funcionando, mas nada vai te avisar. Use Chrome no Android
      ou o app instalado na tela de início no iPhone.</p></div>
    </div>`);
  } else if (Notification.permission === 'denied'){
    partes.push(`<div class="banner grave">
      <div><strong>Notificações bloqueadas</strong>
      <p>Você negou a permissão. Libere nos ajustes do site/app — sem isso nenhum
      prazo vai te avisar.</p></div>
    </div>`);
  } else if (estado.pinNoBanco === false){
    partes.push(`<div class="banner">
      <div><strong>Botões da notificação indisponíveis</strong>
      <p>Não consegui guardar o acesso neste aparelho, então "Feito" e "Adiar"
      direto na notificação não vão funcionar — toque nela para abrir o app.</p></div>
    </div>`);
  }
  if (Notification.permission !== 'granted' && Notification.permission !== 'denied'
      && !(ehIOS && !instalado) && ('PushManager' in window)){
    partes.push(`<div class="banner">
      <div><strong>Ative as notificações</strong>
      <p>Sem isso o app é só uma lista: nada chega até você.</p></div>
      <button class="btn primario" id="btnAtivarPush">Ativar notificações</button>
    </div>`);
  }

  caixa.innerHTML = partes.join('');
  const b = $('btnAtivarPush');
  if (b) b.onclick = ativarPush;
}

function paraUint8(base64){
  const pad = '='.repeat((4 - (base64.length % 4)) % 4);
  const bruto = atob((base64 + pad).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(bruto, (c) => c.charCodeAt(0));
}

async function ativarPush(){
  try {
    const permissao = await Notification.requestPermission();
    if (permissao !== 'granted') return renderBanners();

    const registro = await navigator.serviceWorker.ready;
    const { chavePublica } = await api('api/subscribe');
    const existente = await registro.pushManager.getSubscription();
    const inscricao = existente || await registro.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: paraUint8(chavePublica),
    });
    await api('api/subscribe', {
      method:'POST',
      body: JSON.stringify({ inscricao: inscricao.toJSON(), apelido: navigator.platform || 'aparelho' }),
    });
    renderBanners();
    new Notification('Notificações ativadas', { body: 'Os prazos vão chegar aqui.', icon:'icons/icon-192.png' });
  } catch (e){
    alert('Não consegui ativar: ' + e.message);
  }
}

// ─── Entrada ───────────────────────────────────────────────────────────────
function mostrarTelaPin(mensagem){
  $('telaPin').hidden = false;
  $('app').hidden = true;
  $('banners').innerHTML = '';
  $('erroPin').hidden = !mensagem;
  $('erroPin').textContent = mensagem || '';
  $('campoPin').focus();
}

async function entrar(pin){
  estado.pin = pin;
  try {
    await api('api/reminders');
  } catch (e){
    if (e.status === 401) return mostrarTelaPin('PIN incorreto.');
    // 503 (banco não configurado) e afins passam: a tela mostra o erro real.
  }
  try { localStorage.setItem('lembretes_pin', pin); } catch(e){}
  estado.pinNoBanco = await guardarPinNoBanco(pin);
  $('telaPin').hidden = true;
  $('app').hidden = false;
  renderBanners();
  await carregar();
}

$('btnEntrar').onclick = () => {
  const pin = $('campoPin').value.trim();
  if (pin) entrar(pin);
};
$('campoPin').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('btnEntrar').click(); });
$('btnAtualizar').onclick = carregar;

if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', (e) => {
    if (e.data?.tipo === 'atualizar') carregar();
  });
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && estado.pin) carregar(); });

(function iniciar(){
  let salvo = null;
  try { salvo = localStorage.getItem('lembretes_pin'); } catch(e){}
  if (salvo) entrar(salvo); else mostrarTelaPin('');
})();
</script>
