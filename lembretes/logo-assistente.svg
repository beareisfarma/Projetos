<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Assistente pessoal: cabeça amigável com antena. Desenhado como traço,
       não como massa cheia, pelo mesmo motivo de sempre — em 40px na tela de
       início o contorno se lê melhor que uma silhueta sólida. Os olhos e a
       ponta da antena são cheios: em tamanho pequeno, um círculo vazado de 5px
       fecha e vira uma bolha suja. -->
  <g fill="none" stroke="currentColor" stroke-width="5.2"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="18" y="32" width="64" height="52" rx="18"/>
    <path d="M50 32 V20"/>
    <path d="M40 68 C 44 73, 56 73, 60 68"/>
  </g>
  <circle cx="50" cy="16" r="5" fill="currentColor"/>
  <circle cx="37" cy="52" r="5" fill="currentColor"/>
  <circle cx="63" cy="52" r="5" fill="currentColor"/>
</svg>
