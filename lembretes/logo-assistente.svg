<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Monograma "P" de Personal Assistant: a haste é o corpo, o bojo é o ombro
       e o círculo cheio no vazio é a cabeça. Sólido, não vazado: em 26px (aba do
       navegador) um traço fino some, e um P cheio ainda se lê.
       Desenho próprio — a referência que a Beatriz trouxe (yeschat.ai) serviu de
       direção, nunca de molde. -->
  <g fill="none" stroke="currentColor" stroke-width="15" stroke-linejoin="round">
    <path d="M30 24 H52 A20 20 0 0 1 52 64 H30"/>
  </g>
  <rect x="22" y="16" width="15" height="70" rx="7.5" fill="currentColor"/>
  <circle cx="52" cy="40" r="8" fill="currentColor"/>
</svg>
