<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Monograma "P" de Personal Assistant: a haste é o corpo, o bojo é o ombro
       e o círculo é a cabeça. Sólido, não vazado: em 26px na aba do navegador um
       traço fino some, e um P cheio ainda se lê.
       As cores saíram da referência que a Beatriz trouxe (a logo do yeschat.ai),
       amostradas do arquivo, não estimadas no olho: navy #24293f, azul #4a749e,
       sobre off-white #fcfcfc. A direção veio dali; o desenho é próprio.
       Cores fixas, NÃO currentColor: são duas, e a marca não muda com o tema. -->
  <g fill="none" stroke="#24293f" stroke-width="15" stroke-linejoin="round">
    <path d="M30 24 H52 A20 20 0 0 1 52 64 H30"/>
  </g>
  <rect x="22" y="16" width="15" height="70" rx="7.5" fill="#24293f"/>
  <circle cx="52" cy="40" r="8" fill="#4a749e"/>
</svg>
