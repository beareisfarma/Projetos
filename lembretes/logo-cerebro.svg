<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Cérebro de frente: dois hemisférios com sulcos, e o tronco embaixo.
       Desenhado como traço, não como massa cheia: em 40px na tela de início o
       contorno se lê melhor que uma silhueta sólida. -->
  <g fill="none" stroke="currentColor" stroke-width="5.2"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- silhueta: metade esquerda -->
    <path d="M50 22
             C 46 15, 36 13, 31 18
             C 23 17, 17 23, 19 31
             C 12 35, 12 45, 18 49
             C 13 55, 16 64, 23 66
             C 23 74, 31 79, 38 76
             C 42 82, 50 82, 50 76 Z"/>
    <!-- silhueta: metade direita (espelho) -->
    <path d="M50 22
             C 54 15, 64 13, 69 18
             C 77 17, 83 23, 81 31
             C 88 35, 88 45, 82 49
             C 87 55, 84 64, 77 66
             C 77 74, 69 79, 62 76
             C 58 82, 50 82, 50 76 Z"/>
    <!-- fissura central -->
    <path d="M50 22 L50 76"/>
    <!-- sulcos: esquerda -->
    <path d="M31 18 C 36 24, 34 30, 28 32"/>
    <path d="M18 49 C 26 47, 32 50, 33 57"/>
    <!-- sulcos: direita -->
    <path d="M69 18 C 64 24, 66 30, 72 32"/>
    <path d="M82 49 C 74 47, 68 50, 67 57"/>
  </g>
</svg>
